<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
    <form action="OT.html">
        <label for="">Surname</label>
        <input type="text" placeholder="Enter Surname"><br><br>
        <label for="">Firstname</label>
        <input type="text" placeholder="Enter Firstname"><br><br>
        <label for="">Email Address</label>
        <input type="email" placeholder="Enter Email"><br><br>
        <label for="">Phone Number</label>
        <input type="number" placeholder="Enter Number"><br><br>
        <label for="">Password</label>
        <input type="password" required><br><br>
        <label for="">Age</label>
        <input type="number"><br><br>
        <label for="">State Of Origin</label>
        <select name="" id="">
            <option value=""></option>
            <option value="">Oyo</option>
            <option value="">Ogun</option>
            <option value="">Osun</option>
            <option value="">Lagos</option>
        </select><br><br>
        <label for="">Courses</label>
        <select name="" id="">
            <option value=""></option>
            <option value="">Software Eng...</option>
            <option value="">Hardware Eng...</option>
        </select><br><br>
        <label for="">Gender</label><br>
        <input type="radio" name="Gender">
        <label for="">Female</label>
        <input type="radio" name="Gender">
        <label for="">Male</label>
        <input type="radio" name="Gender">
        <label for="">Prefer not to say</label><br><br>
        <input type="Checkbox">
        <label for="">Remember Me</label><br><br>
        <label for="">Date Of Birth</label>
        <input type="date"><br><br>
        <label for="">Age Bracket</label>
        <input type="range"><br><br>
        <label for="">Upload a Passport</label>
        <input type="file"><br><br>
        <label for="">About</label>
        <textarea name="" id="" cols="40" rows="10" minlength="50" maxlength="60" placeholder="Write About Yourself" required></textarea><br>
        <input type="submit">
    </form>
</body>
</html>
