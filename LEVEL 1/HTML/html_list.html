<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html List</title>
</head>
<body>
    <h1>Ordered list</h1>
    <p>List Of Carbohydrate</p>
    <ol>
        <li>Rice</li>
        <li>Yam</li>
        <li>Garri</li>
        <li>Cassava</li>
    </ol>
    <h2>Unordered List</h2>
    <p>List Of Protein</p>
    <ul>
        <li>Beans</li>
        <li>Fish</li>
        <li>Cheese</li>
    </ul>
    <h3>Descriptive List</h3>
    <p>List & Definiton Of Items</p>
    <dl>
       <dt>Beans</dt>
       <dd>Beans is a Food, A Pea Like Shape.</dd>
    </dl>

</body>
</html>
