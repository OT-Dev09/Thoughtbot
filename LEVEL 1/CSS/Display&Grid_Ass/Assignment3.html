<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>31/03/2026</title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }

    body{
      background-color: darkslategray;
      text-align: center;
    }

    .encap{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgb(3, 46, 46);
    }

    .flex_container{
      background-color: darkcyan;
      display: flex;
      gap: 15px;
      width: 80%;
      margin-top: 20px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .flex_items{
      margin: 10px;
    }

    .flex_items img{
      width: 150px;
      height: 50px;
      border-radius: 25px;
    }

    .encap2{
      margin-top: 100px;
      background-color: rgb(3, 46, 46);
    }

    .grid_container{
      background-color: darkcyan;
      display: grid;
      column-gap: 5px;
      row-gap: 5px;
      /* grid-template-columns: 1fr 1fr 1fr; */
      display: grid;
      grid-template-columns:  1fr 1fr 1fr;
      margin: 20px 120px;
      padding: 30px 20px;
    }

    .grid_items{
      margin: 10px;
    }

    .grid_items img{
      width: 50px;
      height: 25px;
      border-radius: 10px;
    }

  </style>
</head>
<body>
  <div class="encap">
    <h1> Flex Display</h1>
  <div class="flex_container">
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="flex_items">
      <img src="/Img.jpg" alt="">
    </div>
  </div>
  </div>

  <div class="encap2">
    <h1> Grid Display</h1>
    <div class="grid_container">
      <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    <div class="grid_items">
      <img src="/Img.jpg" alt="">
    </div>
    </div>
  </div>

  
</body>
</html>
